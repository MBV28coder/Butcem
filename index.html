<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0c0a">
<title>Bütçem</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bütçem">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: sakin, sıcak, gece; az kelime büyük rakam
   IDEA: akşam ışığında tutulan bir cüzdan uygulaması: sıcak ışık sızan koyu zemin, buzlu cam kartlar
   PICTURE: haftalık noktalı harcama grafiği ve günün büyük rakamı
   COLOUR and TYPE: kahve-siyah zemin, amber ışık, limon yeşili ve turuncu vurgular; Inter Tight
   LAYOUT: telefon önce, tek sütun kartlar, altta yüzen hap menü, ortada sarı + butonu */
:root{color-scheme:dark;--bg:#0f0c0a;--ink:#f4efe7;--mute:rgba(244,239,231,.58);--faint:rgba(244,239,231,.14);
--glass:rgba(255,246,235,.065);--glass2:rgba(255,246,235,.1);--edge:rgba(255,246,235,.09);
--lime:#c6f25a;--sun:#f5d24b;--orange:#ff9d5c;--red:#ff6b57}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 "Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;
background:radial-gradient(120% 60% at 85% -8%,rgba(214,150,80,.55),rgba(140,90,45,.18) 45%,transparent 70%),radial-gradient(90% 50% at 0% 35%,rgba(110,70,35,.28),transparent 60%),radial-gradient(80% 40% at 100% 100%,rgba(90,60,30,.25),transparent 70%),var(--bg);background-attachment:fixed}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 20px 4px;max-width:640px;margin:0 auto}
.mark{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px}
.mark i{width:36px;height:36px;border-radius:50%;background:var(--ink);position:relative;flex:none}.mark i::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--sun);right:-3px;bottom:-3px;border:3px solid var(--bg)}
.ibtn{width:48px;height:48px;border-radius:16px;background:var(--glass2);border:1px solid var(--edge);display:grid;place-items:center;color:var(--ink);padding:0;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.ibtn svg{width:22px;height:22px}
main{max-width:640px;margin:0 auto;padding:8px 16px calc(130px + env(safe-area-inset-bottom))}
.hello{padding:14px 4px 8px}
.hello h1{margin:0;font-size:32px;line-height:1.1;font-weight:500;letter-spacing:-.02em;text-wrap:balance}
.hello p{margin:8px 0 0;font-size:18px;color:var(--mute);line-height:1.4;text-wrap:balance}
.hello p b{color:var(--ink);font-weight:600}
svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:26px;padding:18px;margin:12px 0;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ch .ic{width:34px;height:34px;border-radius:50%;border:1px solid var(--edge);display:grid;place-items:center;flex:none}
.ch .ic svg{width:17px;height:17px}
.ch h2{margin:0;font-size:17px;font-weight:500;flex:1}
.ch .aside{font-size:14px;color:var(--mute);white-space:nowrap}
.big{font-size:clamp(52px,17vw,76px);font-weight:500;line-height:1;letter-spacing:-.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
.big small{font-size:.34em;letter-spacing:0;color:var(--mute);margin-left:6px;font-weight:500}
.big.neg{color:var(--red)}
.mid{font-size:34px;font-weight:500;line-height:1.05;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.mid small{font-size:15px;color:var(--mute);margin-left:4px}
.sub{font-size:14px;color:var(--mute);margin-top:6px}
.sub b{color:var(--ink);font-weight:500}
.muted{color:var(--mute)}.small{font-size:13px}
.lime{color:var(--lime)}.orange{color:var(--orange)}.sun{color:var(--sun)}.red{color:var(--red)}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:12px 0}
.tiles .card{margin:0;padding:16px}
.tiles .mid{font-size:clamp(24px,7.5vw,32px)}
.meter{height:6px;border-radius:9px;background:var(--faint);overflow:hidden;margin:12px 0 4px}
.meter i{display:block;height:100%;background:var(--lime);border-radius:9px}
.meter i.over{background:var(--red)}.meter i.warn{background:var(--orange)}.meter i.ok{background:var(--lime)}.meter i.plain{background:var(--ink)}
.fig{position:relative;height:150px}
.fig svg{position:absolute;inset:0;width:100%;height:100%;stroke:none}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:13px;color:var(--mute);margin-top:8px}
.days .on{color:var(--lime);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--edge)}
.row:first-child{border-top:0}
.row .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .grow{flex:1}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
ul.tips{margin:0;padding:0;list-style:none}
ul.tips li{padding:10px 0 10px 18px;border-top:1px solid var(--edge);position:relative;font-size:15px;color:rgba(244,239,231,.85)}
ul.tips li:first-child{border-top:0;padding-top:2px}
ul.tips li::before{content:"";position:absolute;left:0;top:18px;width:7px;height:7px;border-radius:50%;background:var(--orange)}
ul.tips li:first-child::before{top:10px}
ul.tips li.good::before{background:var(--lime)}
ul.tips b{color:var(--ink);font-weight:600}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:rgba(255,246,235,.07);border:1px solid var(--edge);border-radius:14px;padding:11px 14px;min-height:48px;width:100%;color-scheme:dark}
input::placeholder,textarea::placeholder{color:rgba(244,239,231,.35)}
textarea{min-height:120px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
input:focus{border-color:rgba(245,210,75,.6);outline:none}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 5px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
button{font:inherit;font-size:15px;font-weight:600;min-height:48px;border-radius:16px;border:1px solid var(--edge);background:var(--glass2);color:var(--ink);padding:8px 16px;cursor:pointer}
button:disabled{opacity:.45}
button.pri{background:var(--ink);border-color:var(--ink);color:#15110d}
button.sunb{background:var(--sun);border-color:var(--sun);color:#15110d}
button.full{width:100%;margin-top:12px}
button.x{min-height:40px;min-width:40px;padding:0 8px;background:transparent;border-color:transparent;color:var(--mute);font-size:22px;line-height:1;font-weight:400}
button.sm{min-height:38px;font-size:14px;padding:4px 12px;border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:6px 14px;min-height:42px;font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:#15110d;border-color:var(--ink)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px;background:var(--faint);color:var(--mute);white-space:nowrap}
.tag.red{background:rgba(255,107,87,.16);color:var(--red)}
.tag.green{background:rgba(198,242,90,.14);color:var(--lime)}
.tag.amber{background:rgba(255,157,92,.15);color:var(--orange)}
.ai{background:rgba(255,246,235,.05);border:1px solid var(--edge);border-radius:18px;padding:14px;margin-top:12px;font-size:15px;color:rgba(244,239,231,.88)}
.ai:empty{display:none}
.ai b{color:var(--ink)}
.aibtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px}
.aibtn svg{width:18px;height:18px;color:var(--sun)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--glass);border:1px solid var(--edge);border-radius:18px;padding:4px;margin:8px 0 4px}
.seg button{border:0;background:transparent;min-height:42px;border-radius:14px;font-size:14px;color:var(--mute);padding:4px}
.seg button.on{background:var(--ink);color:#15110d}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav button{width:44px;padding:0;font-size:22px;font-weight:400}
.monthnav b{font-weight:500;font-size:17px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.stat div{background:rgba(255,246,235,.05);border-radius:16px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mute)}
details{border-top:1px solid var(--edge);padding:12px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:500;min-height:32px;display:flex;align-items:center;justify-content:space-between;gap:8px;list-style:none}
summary::-webkit-details-marker{display:none}
details p{margin:8px 0 0;color:var(--mute);font-size:15px}
.bill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;padding:14px 0;border-top:1px solid var(--edge);align-items:center}
.bill:first-child{border-top:0}
.bill .inl{display:grid;grid-template-columns:minmax(0,1fr) 76px auto;gap:8px;grid-column:1/-1;align-items:end}
.bill .inl input{min-height:44px;padding:8px 12px}
.bill .inl label{margin-top:0}
.streaks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.streaks div{background:rgba(255,246,235,.05);border-radius:18px;padding:12px 10px;text-align:center}
.streaks b{display:block;font-size:34px;font-weight:500;line-height:1.1}
.streaks span{display:block;font-size:13px;line-height:1.25;margin-top:4px}
.streaks small{display:block;font-size:12px;color:var(--mute);margin-top:4px}
.grade{display:flex;align-items:center;gap:16px;margin-top:14px}
.grade .L{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;font-size:48px;font-weight:600;flex:none;background:var(--faint)}
.grade .L.lime{background:rgba(198,242,90,.16)}.grade .L.sun{background:rgba(245,210,75,.16)}.grade .L.orange{background:rgba(255,157,92,.16)}.grade .L.red{background:rgba(255,107,87,.16)}
.btns{display:flex;gap:8px;margin-top:8px}
.btns button{flex:1}
.plus{color:var(--lime)}
.imp{display:block;padding:12px 0;border-top:1px solid var(--edge)}
.imp:first-child{border-top:0}
.imp .top{display:flex;gap:10px;justify-content:space-between;align-items:baseline}
.imp .top span:first-child{font-weight:500;overflow-wrap:anywhere}
.imp .sel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:8px}
.imp select{min-height:42px;padding:6px 10px;font-size:15px}
.imp.skip{opacity:.55}
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:4px 12px;font-size:14px;margin-top:4px}
.daylbl{font-size:13px;color:var(--mute);margin:16px 0 0}
.empty{color:var(--mute);font-size:15px;padding:4px 0}
nav{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:7px;border-radius:30px;background:rgba(30,25,21,.72);border:1px solid var(--edge);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);box-shadow:0 12px 40px rgba(0,0,0,.45)}
.pill button{width:58px;height:58px;min-height:0;padding:0;border-radius:22px;border:0;background:transparent;color:var(--mute);display:grid;place-items:center}
.pill button svg{width:25px;height:25px}
.pill button.on{background:var(--ink);color:#15110d}
.pill button.add{background:rgba(245,210,75,.14);color:var(--sun)}
.pill button.add svg{width:28px;height:28px;stroke-width:2.2}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;background:var(--ink);color:#15110d;border-radius:18px;padding:10px 10px 10px 18px;display:flex;gap:12px;align-items:center;max-width:92vw;white-space:nowrap;transition:.22s;z-index:30;font-size:15px;font-weight:500}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{background:transparent;color:#15110d;border-color:rgba(0,0,0,.2);min-height:38px;border-radius:12px}
#modal,#sheet{position:fixed;inset:0;z-index:20;display:none}
#modal{background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
#modal .card{max-width:420px;width:100%;background:#1d1814}
#modal h2{margin:0 0 6px;font-size:20px;font-weight:600}
#sheet.show{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet-card{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:#1b1612;border:1px solid var(--edge);border-bottom:0;border-radius:30px 30px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--faint);margin:0 auto 10px}
.sh-head{display:flex;align-items:center;justify-content:space-between}
.sh-head b{font-size:18px;font-weight:600}
.amt{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:14px 0 8px}
.amt input{background:transparent;border:0;font-size:56px;font-weight:500;letter-spacing:-.03em;text-align:center;width:1.6ch;max-width:70vw;padding:0;min-height:70px;font-variant-numeric:tabular-nums}
.amt input:focus{border:0}
.amt span{font-size:22px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.sheet-card{animation:none}}
@media(max-width:370px){.grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid3>:first-child{grid-column:1/-1}.pill button{width:52px;height:52px}.hello h1{font-size:28px}}
</style>
</head>
<body>
<header>
  <div class="mark"><i aria-hidden="true"></i>Bütçem</div>
  <button class="ibtn" data-act="view" data-v="ayar" aria-label="Ayarlar"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</header>
<main id="app"><div class="hello"><h1>Bütçem</h1><p>Veriler yükleniyor…</p></div></main>
<nav><div class="pill" id="nav">
  <button data-act="view" data-v="bugun" data-g="bugun" aria-label="Bugün"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg></button>
  <button data-act="view" data-v="harcama" data-g="harcama" aria-label="Harcamalar"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="M9 15v-3M12 15V9M15 15v-5"/></svg></button>
  <button class="add" data-act="add-open" aria-label="Harcama ekle"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-act="view" data-v="fatura" data-g="odeme" aria-label="Ödemeler"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="4"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></button>
  <button data-act="view" data-v="birikim" data-g="birikim" aria-label="Birikim"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.5c0-1.2 1.1-2 2.5-2s2.5.7 2.5 1.8c0 2.5-5 1.4-5 3.8 0 1.1 1.1 1.9 2.5 1.9s2.5-.8 2.5-2"/></svg></button>
</div></nav>
<div id="sheet"><div class="sheet-bg" data-act="add-close"></div><div class="sheet-card" role="dialog" aria-label="Harcama ekle">
  <div class="grab"></div>
  <div class="sh-head"><b id="sh-title">Ekle</b><button class="x" data-act="add-close" aria-label="Kapat">×</button></div>
  <div class="seg" id="sh-seg" style="grid-template-columns:repeat(3,minmax(0,1fr))"></div>
  <div class="amt"><input id="qa-amt" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Tutar"><span>TL</span></div>
  <div id="qa-chips" class="chips"></div>
  <div class="grid2"><div><label for="qa-note" id="qa-note-l">Not</label><input id="qa-note" placeholder="ör. öğle yemeği"></div><div id="qa-date-w"><label for="qa-date">Tarih</label><input id="qa-date" type="date"></div></div>
  <p id="sh-hint" class="muted small" style="margin:10px 0 0"></p>
  <button class="sunb full" data-act="qa-add" id="qa-btn">Ekle</button>
</div></div>
<div id="toast" role="status"><span id="toast-t"></span><button id="toast-u" data-act="undo" hidden>Geri al</button></div>
<div id="modal"><div class="card"><h2 id="modal-t">Emin misin?</h2><p id="modal-b" class="muted"></p><div class="grid2"><button data-act="modal-no" id="modal-no">Vazgeç</button><button class="pri" data-act="modal-yes" id="modal-yes">Onayla</button></div></div></div>
<script>
{
const $=s=>document.querySelector(s);
const CATS=[
 {k:'market',t:'Market',col:'#c6f25a'},{k:'restoran',t:'Restoran',col:'#ff9d5c'},{k:'kafe',t:'Kafe',col:'#e2b878'},
 {k:'ulasim',t:'Ulaşım',col:'#7fc6ff'},{k:'alisveris',t:'Alışveriş',col:'#c7a3ff'},{k:'eglence',t:'Eğlence',col:'#f5d24b'},{k:'diger',t:'Diğer',col:'#a39d94'}];
const CAT=Object.fromEntries(CATS.map(c=>[c.k,c]));
const FOOD=['market','restoran','kafe'];
const SPLIT={market:.30,restoran:.14,kafe:.08,ulasim:.15,alisveris:.15,eglence:.08,diger:.10};
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const WD=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const VIEWS=['bugun','harcama','karne','ekstre','fatura','abonelik','taksit','birikim','istek','ayar'];
const GROUP={bugun:'bugun',harcama:'harcama',karne:'harcama',ekstre:'harcama',fatura:'odeme',abonelik:'odeme',taksit:'odeme',birikim:'birikim',istek:'birikim'};
const WAIT=24*3600*1000;
const DOCS=['settings','bills','subs','inst','savings','income','wish'];
const DEF={settings:{name:'',salary:'',monthlySave:'',saveGoal:'',start:'',limits:{}},bills:{items:[]},subs:{items:[]},inst:{items:[]},savings:{entries:[],cancelled:[]},income:{items:[]},wish:{items:[]}};
const IC={
 spark:'<svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/></svg>',
 trend:'<svg viewBox="0 0 24 24"><path d="M4 17l5-5 3 3 7-7"/><path d="M15 8h4v4"/></svg>',
 food:'<svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v8a2 2 0 0 1-2 2M17 21V3c-2 1-3 4-3 8h3"/></svg>',

function save(key){

  if(!db){lsSet(key,data);return}
  const q=wq[key]||(wq[key]={busy:false,pending:false});
  if(q.busy){q.pending=true;return}
  q.busy=true;
  db.doc('budget/'+key).set(clone(data)).catch(e=>{
    if(e&&e.code==='unavailable')setTimeout(()=>save(key),800+Math.random()*800);
    else toast(e&&e.code==='quota_exceeded'?'Depolama alanı doldu.':'Kaydedilemedi, tekrar dene.');

  if(wk[1]&&wn[1]){const a=wk[0]/wk[1],b=wn[0]/wn[1];if(b>0&&a>b*1.4)out.push({w:5,good:false,t:`<b>Hafta sonu etkisi:</b> Hafta sonları günde ortalama ${tl(a)}, hafta içi ${tl(b)} harcıyorsun. Hafta sonu için önceden plan yap.`})}
  const over=CATS.filter(k=>lim[k.k]>0&&(by[k.k]||0)>lim[k.k]*(isCur?c.t/D:1)*1.1);
  if(over.length)out.push({w:7,good:false,t:`<b>Limit aşımı:</b> ${over.map(k=>k.t).join(', ')} planın üstünde gidiyor${over.length===1?'':'lar'}.`});
  const un=S.subs.items.filter(x=>x.use==='hayir'),subT=sum(S.subs.items,x=>num(x.amount));
  if(un.length)out.push({w:8,good:false,t:`<b>Abonelikler:</b> Kullanmadığın ${un.map(x=>esc(x.name)).join(', ')} için yılda <b>${tl(sum(un,x=>num(x.amount))*12)}</b> ödüyorsun. İptal et.`});
  else if(subT>B.salary*.08&&B.salary)out.push({w:4,good:false,t:`<b>Abonelikler:</b> Ayda ${tl(subT)} abonelik ödüyorsun, maaşının %${pct(subT,B.salary)}'i. Hepsini gerçekten kullanıyor musun?`});
  const goal=num(S.settings.saveGoal),saved=sum(S.savings.entries,e=>num(e.a));
  if(!B.plan&&B.salary)out.push({w:6,good:false,t:`<b>Birikim:</b> Aylık birikim tutarı belirlemedin. Maaşının %10'u olan <b>${tl(B.salary*.1)}</b> ile başla, maaş gelince ilk iş kenara koy.`});
  else if(goal&&saved<goal&&B.plan)out.push({w:3,good:true,t:`<b>Birikim:</b> Hedefinin %${pct(saved,goal)}'indesin. Ayda ${tl(B.plan)} ile ${Math.ceil((goal-saved)/B.plan)} ay kaldı.`});
  if(ptotal&&total<ptotal*(isCur?c.t/D:1)*.9)out.push({w:4,good:true,t:`<b>İyi gidiyorsun:</b> Geçen ayın aynı dönemine göre daha az harcıyorsun.`});

  return{list:out.sort((a,b)=>b.w-a.w),target};
}
function adviceToday(c){
  const tips=[],L=Math.max(0,c.foodLeft),meals=pick(MEALS_HOME,2);
  let food;
  if(L<=0)food=`Bugünün yemek hakkı bitti. Evde ne varsa onunla idare et, ör. ${meals[0]}.`;
  else if(recentHas('restoran',1)&&L<700)food=`Dün dışarıda yedin, bugün evde ye: ${meals.join(' ya da ')}. Hakkın ${tl(L)}.`;
  else if(L<150)food=`${tl(L)} hakkın var. Evde pişir: ${meals.join(' ya da ')}.`;
  else if(L<350)food=`${tl(L)} hakkın var. En iyisi evde ${meals[0]}. Dışarıda yersen tek kalem söyle, içeceği evden götür.`;
  else if(L<700)food=`${tl(L)} hakkın var. Esnaf lokantasında bir öğün sığar, kahveyi evde iç.`;
  else food=`${tl(L)} hakkın var. Dışarıda rahat bir öğün sığar, harcamadığın kısım yarına kalır.`;
  tips.push({good:true,t:`<b>Yemek:</b> ${food}`});
  const pace=c.t/c.D,hot=CATS.map(k=>({...k,r:c.lim[k.k]?c.byCat[k.k]/c.lim[k.k]:0})).filter(k=>k.r>pace+.1).sort((a,b)=>b.r-a.r)[0];
  let no;
  if(c.left<0)no=`Bugünkü hakkını ${tl(-c.left)} aştın. Bugün başka harcama yapma.`;
  else if(hot)no=`${hot.t}. Limitinin %${Math.round(hot.r*100)}'i bitti, ayın ise %${Math.round(pace*100)}'i geçti.`;
  else if(weekCount('kafe')>=3)no=`Kafe. Bu hafta ${weekCount('kafe')} kez gittin, bugün kahveni evde yap.`;
  else no='Plansız alışveriş. Aklına bir şey takılırsa önce İstek listesine ekle, yarın karar ver.';
  tips.push({good:false,t:`<b>Bugün alma:</b> ${no}`});
  const ins=insights(c.m,c).list.filter(x=>!/Limit aşımı/.test(x.t));
  if(ins.length)tips.push(ins[dayIdx()%Math.min(3,ins.length)]);
  const ready=S.wish.items.filter(x=>x.status==='bekliyor').length;
  if(ready&&tips.length<4)tips.push({good:true,t:`<b>İstek listesi:</b> Bekleyen ${ready} isteğin var. Acele etme, süre dolunca karar ver.`});
  return tips;
}
function weekData(){
  const d=new Date(),dow=(d.getDay()+6)%7,out=[];
  for(let i=0;i<7;i++){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow+i),s=ymd(x),it=(S.exp[s.slice(0,7)]||{items:[]}).items;
    out.push({s,v:sum(it.filter(e=>e.d===s),e=>num(e.a)),fut:i>dow,today:i===dow})}
  return out;
}

const NORM=s=>' '+String(s||'').toLocaleUpperCase('tr-TR').replace(/İ/g,'I').replace(/Ş/g,'S').replace(/Ğ/g,'G').replace(/Ü/g,'U').replace(/Ö/g,'O').replace(/Ç/g,'C').replace(/[^A-Z0-9&.\/ ]/g,' ').replace(/\s+/g,' ').trim()+' ';
const KW={
 market:['MIGROS','MACROCENTER','A101','BIM','SOK','CARREFOUR','METRO GROSS','FILE MARKET','HAKMAR','TARIM KREDI','GETIR','ISTEGELSIN','MARKET','BAKKAL','MANAV','KASAP','FIRIN','EKMEK','SUPERMARKET'],
 restoran:['YEMEKSEPETI','TRENDYOL YEMEK','GETIRYEMEK','GETIR YEMEK','BURGER','MCDONALD','KFC','DOMINO','PIZZA','POPEYES','SUBWAY','LOKANTA','LOKANTASI','RESTORAN','RESTAURANT','KEBAP','DONER','PIDE','KOFTE','BALIK','CIGKOFTE','TANTUNI','MANGAL','OCAKBASI','DURUM','LAHMACUN','YEMEK'],
 kafe:['STARBUCKS','KAHVE DUNYASI','CAFFE NERO','GLORIA JEAN','ESPRESSOLAB','MAMBOCINO','KRONOTROP','COFFEE','KAHVE','CAFE','KAFE','SIMIT SARAYI','TATLI','PASTANE','PASTA','BAKLAVA','DONDURMA','CAY'],
 ulasim:['SHELL','OPET','BP','PETROL OFISI','PO','TOTAL','AYTEMIZ','LUKOIL','AKARYAKIT','PETROL','ISTANBULKART','KENTKART','BILET','MARTI','BITAKSI','UBER','TAKSI','OTOPARK','HGS','OGS','THY','TURK HAVA','PEGASUS','AJET','OBILET','OTOBUS','METRO TURIZM','KAMIL KOC'],
 alisveris:['TRENDYOL','HEPSIBURADA','AMAZON','N11','CICEKSEPETI','ZARA','H&M','LC WAIKIKI','LCW','DEFACTO','KOTON','MAVI','BOYNER','FLO','DECATHLON','TEKNOSA','MEDIAMARKT','MEDIA MARKT','VATAN','IKEA','KOCTAS','WATSONS','GRATIS','ROSSMANN','SEPHORA','MAGAZA','MAGAZACILIK','TEMU','SHEIN','ALIEXPRESS','GIYIM','AYAKKABI'],
 eglence:['SINEMA','CINEMAXIMUM','CINEVERSE','BILETIX','PASSO','STEAM','EPIC GAMES','BOWLING','KONSER','MUZE','OYUN','PLAYSTATION STORE','BILARDO','LUNAPARK']};
const SUBKW=[['NETFLIX','Netflix'],['SPOTIFY','Spotify'],['YOUTUBE','YouTube Premium'],['DISNEY','Disney+'],['APPLE.COM','Apple'],['ITUNES','Apple'],['ICLOUD','iCloud'],['GOOGLE ONE','Google One'],['GOOGLE STORAGE','Google One'],['AMAZON PRIME','Amazon Prime'],['PRIME VIDEO','Amazon Prime'],['EXXEN','Exxen'],['BLUTV','BluTV'],['BLU TV','BluTV'],['TABII','Tabii'],['GAIN','Gain'],['MUBI','Mubi'],['CHATGPT','ChatGPT'],['OPENAI','ChatGPT'],['ANTHROPIC','Claude'],['CLAUDE.AI','Claude'],['DUOLINGO','Duolingo'],['CANVA','Canva'],['ADOBE','Adobe'],['GAME PASS','Xbox Game Pass'],['PS PLUS','PlayStation Plus'],['PLAYSTATION PLUS','PlayStation Plus'],['MACFIT','Spor salonu'],['SPOR SALONU','Spor salonu'],['FITNESS','Spor salonu'],['GYM','Spor salonu']];
const BILLKW=['TURKCELL','VODAFONE','TURK TELEKOM','TT MOBIL','TTNET','SUPERONLINE','ENERJISA','CK ENERJI','AYEDAS','BEDAS','IGDAS','ISKI','ASKI','IZSU','BASKENTGAZ','AKSAGAZ','ESGAZ','ELEKTRIK','DOGALGAZ','SU IDARESI','AIDAT','KIRA','FATURA'];
const PAYKW=['ODEME','ODEMENIZ','TAHSILAT','HESAPTAN','BORC ODEME','OTOMATIK ODEME','EFT','HAVALE'];
const hasKW=(N,list)=>list.find(k=>k.length<=4?N.includes(' '+k+' '):N.includes(k));
function classify(desc,signed){
  const N=NORM(desc);
  if(/ IADE /.test(N))return{type:'atla',why:'iade',cat:'diger'};
  if(signed||hasKW(N,PAYKW))return{type:'atla',why:'kart ödemesi',cat:'diger'};
  if(/ TAKSIT|\d+\s?\/\s?\d+ TAKS/.test(N))return{type:'atla',why:'taksit, Taksitler\'de takip et',cat:'alisveris'};
  const sub=SUBKW.find(([k])=>N.includes(k));if(sub)return{type:'abonelik',why:'abonelik',cat:'eglence',sub:sub[1]};
  if(hasKW(N,BILLKW))return{type:'atla',why:'fatura, Faturalar\'da takip ediliyor',cat:'diger'};
  for(const k of ['kafe','restoran','market','ulasim','alisveris','eglence'])if(hasKW(N,KW[k]))return{type:'gider',cat:k};
  return{type:'gider',cat:'diger',why:'kategori bulunamadı'};
}
function csvSplit(l){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}else if((ch===';'||ch==='\t'||ch===',')&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o}
const amt=s=>/^\d{1,3}(,\d{3})+\.\d{2}$/.test(s)?parseFloat(s.replace(/,/g,'')):num(s);
function parseStatement(txt){
  const now=new Date(),out=[];
  for(let raw of String(txt||'').replace(/\r/g,'').split('\n')){
    raw=raw.trim();if(!raw)continue;
    let l=raw;if(/[;\t]/.test(l)||/^"[^"]*",/.test(l))l=csvSplit(l).map(x=>x.trim()).join('   ');
    const dm=l.match(/(^|[^\d])(\d{1,2})[.\/-](\d{1,2})(?:[.\/-](\d{2,4}))?(?![\d])/);if(!dm)continue;
    const dd=+dm[2],mm=+dm[3];let yy=dm[4]?+dm[4]:0;if(mm<1||mm>12||dd<1||dd>31)continue;
    if(yy&&yy<100)yy+=2000;if(!yy){yy=now.getFullYear();if(mm>now.getMonth()+1)yy--}
    const pos=dm.index+dm[1].length,rest=(l.slice(0,pos)+'   '+l.slice(pos+dm[0].length-dm[1].length)).replace(/\b\d{1,2}[.\/-]\d{1,2}[.\/-]\d{2,4}\b/g,' ');
    const ms=[...rest.matchAll(/([+-]?)\s?(\d{1,3}(?:\.\d{3})+,\d{2}|\d{1,3}(?:,\d{3})+\.\d{2}|\d+,\d{2}|\d+\.\d{2})(?![\d])/g)];if(!ms.length)continue;
    const a0=ms[0],a=amt(a0[2]);if(!(a>0))continue;
    let desc=rest.slice(0,a0.index).replace(/\b(TL|TRY)\b|₺/gi,' ').replace(/\s+/g,' ').trim();
    if(desc.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g,'').length<2)desc=rest.slice(a0.index+a0[0].length).replace(/[\d.,+-]+|\b(TL|TRY)\b|₺/gi,' ').replace(/\s+/g,' ').trim();
    if(!desc)desc='Kart harcaması';
    const neg=a0[1]==='-'||a0[1]==='+'||/^\s*-/.test(rest.slice(a0.index+a0[0].length));
    const k=classify(desc,neg);
    out.push({d:yy+'-'+pad(mm)+'-'+pad(dd),a:Math.round(a*100)/100,desc:desc.slice(0,48),act:k.type,cat:k.cat,why:k.why||'',sub:k.sub||''});
  }
  return out;
}
async function runParse(txt){
  const rows=parseStatement(txt);if(!rows.length){toast('Tarih ve tutar içeren satır bulunamadı');return}
  for(const m of [...new Set(rows.map(r=>r.d.slice(0,7)))])await ensureMonth(m);
  rows.forEach(r=>{const ex=(S.exp[r.d.slice(0,7)]||{items:[]}).items;if(r.act==='gider'&&ex.some(i=>i.d===r.d&&Math.abs(num(i.a)-r.a)<.01)){r.act='atla';r.why='zaten kayıtlı'}
    if(r.act==='abonelik'&&S.subs.items.some(x=>NORM(x.name).includes(NORM(r.sub).trim()))){r.act='atla';r.why='abonelik zaten listede'}});
  IMP=rows;render();
}

function drawWeek(){
  const s=document.getElementById('wk');if(!s||!WK)return;
  const W=s.clientWidth,H=s.clientHeight;if(!W||!H)return;
  const c=calc(),bw=W/7,sp=Math.max(6,Math.min(10,bw/5)),r=sp*.26,cols=Math.max(3,Math.floor((bw-sp)/sp)),rows=Math.floor(H/sp);
  const max=Math.max(c.daily*1.4,...WK.map(d=>d.v),1);
  let out='';
  WK.forEach((d,i)=>{
    const fill=d.v>0?Math.max(1,Math.round(d.v/max*rows)):0,x0=i*bw+(bw-(cols-1)*sp)/2;
    const over=c.daily>0&&d.v>c.daily;
    for(let cI=0;cI<cols;cI++)for(let rI=0;rI<rows;rI++){
      const on=rI<fill,col=on?(d.today?'#c6f25a':over?'#ff9d5c':'rgba(244,239,231,.78)'):'rgba(244,239,231,.12)';
      out+=`<circle cx="${(x0+cI*sp).toFixed(1)}" cy="${(H-sp/2-rI*sp).toFixed(1)}" r="${on?r*1.15:r*.8}" fill="${col}"/>`}
  });
  if(c.daily>0){const y=H-(Math.round(c.daily/max*rows)*sp);out+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(198,242,90,.55)" stroke-width="1.2" stroke-dasharray="4 5"/>`}
  s.innerHTML=out;
}

  case'wish-del':removeWithUndo('wish',S.wish.items,k,'İstek');break;
  case'wish-buy':{const x=S.wish.items.find(y=>y.id===k);if(!x)return;const d=ymd(new Date()),m=d.slice(0,7);ensureMonth(m).then(()=>{x.status='alindi';x.decided=Date.now();S.exp[m].items.push({id:uid(),d,a:num(x.price),c:x.cat,n:x.name,s:'el',ts:Date.now()});save('exp-'+m);save('wish');render();toast(x.name+' harcamalara eklendi')});break}
  case'wish-skip':{const x=S.wish.items.find(y=>y.id===k);if(!x)return;const mark=()=>{x.status='vazgecildi';x.decided=Date.now();save('wish');render()};
    ask('Vazgeçtin, harika!',`${tl(x.price)} birikime aktarılsın mı?`,()=>{S.savings.entries.push({id:uid(),d:ymd(new Date()),a:num(x.price),n:'İstek: '+x.name,k:true});save('savings');mark();toast(tl(x.price)+' birikime aktarıldı')},{yes:'Birikime aktar',no:'Sadece vazgeç',onNo:()=>{mark();toast('Vazgeçildi')}});break}
  case'sav-add':{const v=num($('#sv-amt').value);if(v<=0)return toast('Tutarı yaz');S.savings.entries.push({id:uid(),d:ymd(new Date()),a:v,n:$('#sv-note').value.trim()});$('#sv-amt').value='';$('#sv-note').value='';save('savings');render();toast(tl(v)+' birikime eklendi');break}
  case'sav-move':{const v=num(k);if(v<=0)return;S.savings.entries.push({id:uid(),d:ymd(new Date()),a:v,n:'Kumbara',k:true});save('savings');render();toast(tl(v)+' birikime aktarıldı');break}
  case'sav-del':removeWithUndo('savings',S.savings.entries,k,'Kayıt');break;
  case'lim-auto':S.settings.limits={};save('settings');render();toast('Limitler otomatik');break;
  
  case'backup':makeBackup();break;
  case'restore-open':showBackup='in';render();break;
  case'restore-go':{const t=$('#bk-in').value.trim();if(!t)return toast('Dosya seç ya da metni yapıştır');applyBackup(t);break}
  case'bk-copy':{const t=$('#bk-out');try{navigator.clipboard.writeText(t.value).then(()=>toast('Kopyalandı'),()=>{t.select();toast('Metni seçip kopyala')})}catch(x){t.select();toast('Metni seçip kopyala')}break}
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='bk-file'&&el.files&&el.files[0]){el.files[0].text().then(applyBackup);return}
  if(el.id==='ex-file'&&el.files&&el.files[0]){el.files[0].text().then(t=>{$('#ex-in').value=t;runParse(t)});return}
  if(el.dataset.imp&&IMP){const[i,f]=el.dataset.imp.split('|');IMP[+i][f]=el.value;if(f==='act')IMP[+i].why='';render();return}
  if(el.dataset.bind){
    const p=el.dataset.bind.split('.'),doc=p.shift();let o=S[doc];
    for(let i=0;i<p.length-1;i++)o=o[p[i]]||(o[p[i]]={});
    const f=p[p.length-1],v=el.value.trim();
    if(el.dataset.text!==undefined)o[f]=v;
    else if(v===''){if(p.length>1&&p[0]==='limits')delete o[f];else o[f]=''}else o[f]=num(v);
    save(doc);render();return;
  }
  if(el.dataset.item){
    const[doc,id,f]=el.dataset.item.split('|'),x=S[doc].items.find(y=>y.id===id);if(!x)return;
    const v=el.value.trim();x[f]=v===''?'':(f==='due'?Math.min(31,Math.max(1,Math.round(num(v)))):num(v));save(doc);render();
  }
});
document.addEventListener('input',e=>{if(e.target.id==='qa-amt')fitAmt()});
function fitAmt(){const e=$('#qa-amt');e.style.width=Math.max(1,e.value.length)*.62+.4+'em'}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='qa-amt'){e.preventDefault();addExpense()}
  if(e.key==='Escape'){closeSheet();$('#modal').classList.remove('show')}
});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
}
</script>
</body>
